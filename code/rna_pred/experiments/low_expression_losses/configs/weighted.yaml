project_root: ../../../../..
data_dir: data/ml-4-g-project-1
reference_fasta: data/reference/hg38.fa
prepared_dir: data/prepared/default
cache_dir: data/cache/alphagenome-default
run_dir: outputs/experiments/low_expression_losses/weighted
regions:
  max_candidates: 60
  radius: 100000
  promoter_bp: 2048
  candidate_bp: 512
  window_bp: 262144
tracks: [DNase, H3K27ac, H3K4me3, H3K9me3, H3K27me3]
extraction:
  checkpoint_path: data/checkpoints/model_all_folds.safetensors
  checkpoint_repo: gtca/alphagenome_pytorch
  checkpoint_file: model_all_folds.safetensors
  checkpoint_revision: b01c0ffa73e07c053491f3b5ea8bcf67d93b9920
  port_revision: 72268c011d37cf2d387506493614952d85abe21b
  batch_size: 1
  shard_windows: 32
  mixed_precision: true
model:
  embedding_dim: 3072
  width: 64
  heads: 4
  layers: 3
  feedforward: 256
train:
  seed: 42
  batch_size: 256
  epochs: 50
  patience: 8
  train_min_relative_improvement: 0.001
  val_min_relative_rise: 0.001
  learning_rate: 0.0001
  weight_decay: 0.000001
  num_workers: 0
  device: auto
  cpu_threads: 4

  selection_metric: val_mean_spearman
  objective:
    name: weighted_smooth_l1
    low_quantile: 0.25
    low_weight: 2.0
    ranking_weight: 0.1
    temperature: 1.0
    pairs_per_group: 1024
